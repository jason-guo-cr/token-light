[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "token-light"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
token-light = "token_light.cli:main"

[tool.setuptools]
package-dir = {"" = "host"}

[tool.setuptools.packages.find]
where = ["host"]
